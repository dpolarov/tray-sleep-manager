name: Apply PR3 sleep refactor

on:
  push:
    branches:
      - fix/single-external-clamshell-detection

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Use shared Sleep now engine for automatic sleep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/single-external-clamshell-detection
      - name: Patch sources
        shell: python
        run: |
          import pathlib, re

          power = pathlib.Path('PowerManager.cs')
          text = power.read_text(encoding='utf-8')
          text = text.replace('        private static bool isPreventingSleep = false;\n        private static Timer? pendingClamshellSleepTimer;\n', '        private static bool isPreventingSleep = false;\n')
          text = text.replace('        public static void PreventSleep()\n        {\n            CancelPendingClamshellSleep();\n\n', '        public static void PreventSleep()\n        {\n')
          pattern = re.compile(r'        public static void AllowSleep\(\)\n        \{.*?\n        \}\n\n        public static bool IsPreventingSleep\(\)', re.S)
          replacement = '''        public static void AllowSleep()
        {
            if (isPreventingSleep)
            {
                SetThreadExecutionState(EXECUTION_STATE.ES_CONTINUOUS);
                isPreventingSleep = false;
            }
        }

        public static bool IsPreventingSleep()'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not replace PowerManager AllowSleep block')
          power.write_text(text, encoding='utf-8', newline='\n')

          tray = pathlib.Path('TrayApplicationContext.cs')
          text = tray.read_text(encoding='utf-8')
          text = text.replace(
              '        private readonly Timer autoSleepTimer;\n',
              '        private readonly Timer autoSleepTimer;\n        private Timer? pendingSleepLikeSleepNowTimer;\n',
              1)
          text = text.replace(
              '            WorkMode previousMode = currentMode;\n            currentMode = mode;\n',
              '            CancelPendingSleepLikeSleepNow();\n\n            WorkMode previousMode = currentMode;\n            currentMode = mode;\n',
              1)
          old_trigger = '''            AppLog.Write("AutoSleep", "Executing automatic sleep command");

            if (!PowerManager.GoToSleep())
            {
                AppLog.Write("AutoSleep", "Automatic sleep command reported failure");
                System.Diagnostics.Debug.WriteLine("Failed to trigger auto sleep");
            }'''
          new_trigger = '''            if (!ExecuteSleepLikeSleepNow("AutoSleep", "Executing automatic sleep command through shared Sleep now engine"))
            {
                AppLog.Write("AutoSleep", "Automatic sleep command reported failure");
                System.Diagnostics.Debug.WriteLine("Failed to trigger auto sleep");
            }'''
          if old_trigger not in text:
              raise SystemExit('Could not find TriggerAutoSleep block')
          text = text.replace(old_trigger, new_trigger, 1)

          marker = '''            if (wasPreventingSleep != shouldPreventSleep)
                PlayStatusChangeSound(shouldPreventSleep);
        }

        private static void PlayStatusChangeSound(bool isProtectionActive)'''
          replacement = '''            if (wasPreventingSleep != shouldPreventSleep)
                PlayStatusChangeSound(shouldPreventSleep);

            if (currentMode == WorkMode.AlwaysAllow &&
                wasPreventingSleep &&
                lidOperationSucceeded &&
                !PowerManager.IsPreventingSleep() &&
                MonitorDetector.IsExternalOnlyActive())
            {
                ScheduleSleepLikeSleepNow();
            }
            else if (shouldPreventSleep || currentMode != WorkMode.AlwaysAllow)
            {
                CancelPendingSleepLikeSleepNow();
            }
        }

        private void ScheduleSleepLikeSleepNow()
        {
            CancelPendingSleepLikeSleepNow();
            AppLog.Write("AutoSleep", "Lid settings restored and sleep protection released; scheduling shared Sleep now engine in 3 seconds");

            var timer = new Timer { Interval = 3000 };
            pendingSleepLikeSleepNowTimer = timer;
            timer.Tick += (_, _) =>
            {
                timer.Stop();
                timer.Dispose();
                if (ReferenceEquals(pendingSleepLikeSleepNowTimer, timer))
                    pendingSleepLikeSleepNowTimer = null;

                if (isExiting ||
                    currentMode != WorkMode.AlwaysAllow ||
                    PowerManager.IsPreventingSleep() ||
                    lidActionManager.IsModified ||
                    !MonitorDetector.IsExternalOnlyActive())
                {
                    AppLog.Write("AutoSleep", "Scheduled shared Sleep now engine cancelled because power/lid/display state changed");
                    return;
                }

                if (!ExecuteSleepLikeSleepNow("AutoSleep", "Executing shared Sleep now engine after Always allow sleep in clamshell mode"))
                    AppLog.Write("AutoSleep", "Shared Sleep now engine reported failure");
            };
            timer.Start();
        }

        private void CancelPendingSleepLikeSleepNow()
        {
            if (pendingSleepLikeSleepNowTimer == null)
                return;

            try
            {
                pendingSleepLikeSleepNowTimer.Stop();
                pendingSleepLikeSleepNowTimer.Dispose();
            }
            catch { }

            pendingSleepLikeSleepNowTimer = null;
        }

        private static bool ExecuteSleepLikeSleepNow(string logCategory, string logMessage)
        {
            AppLog.Write(logCategory, logMessage);
            return PowerManager.GoToSleep();
        }

        private static void PlayStatusChangeSound(bool isProtectionActive)'''
          if marker not in text:
              raise SystemExit('Could not find UpdatePowerState insertion marker')
          text = text.replace(marker, replacement, 1)

          text = text.replace(
              '            if (!PowerManager.GoToSleep())\n            {\n                AppLog.Write("Sleep", "Sleep now reported failure");',
              '            if (!ExecuteSleepLikeSleepNow("UI", "Executing Sleep now through shared sleep engine"))\n            {\n                AppLog.Write("Sleep", "Sleep now reported failure");',
              1)
          text = text.replace(
              '            isExiting = true;\n\n            monitorCheckTimer.Stop();',
              '            isExiting = true;\n            CancelPendingSleepLikeSleepNow();\n\n            monitorCheckTimer.Stop();',
              1)
          tray.write_text(text, encoding='utf-8', newline='\n')

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- PowerManager.cs TrayApplicationContext.cs; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PowerManager.cs TrayApplicationContext.cs
          git commit -m "Use shared Sleep now engine for automatic sleep"
          git push origin HEAD:fix/single-external-clamshell-detection
