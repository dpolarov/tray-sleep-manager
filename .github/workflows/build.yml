name: Build Windows

on:
  push:
    branches:
      - main
      - 'agent/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and publish
    runs-on: windows-latest
    outputs:
      release_tag: ${{ steps.release_meta.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SleepMngr.csproj

      - name: Build
        run: dotnet build SleepMngr.csproj -c Release --no-restore

      - name: Smoke test non-elevated failure handling
        run: dotnet run --project SleepMngr.csproj -c Release --no-build -- --self-test

      - name: Publish compact build
        run: dotnet publish SleepMngr.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/compact

      - name: Publish standalone build
        run: dotnet publish SleepMngr.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/standalone

      - name: Create ZIP packages
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/compact/* -DestinationPath artifacts/SleepMngr-win-x64-compact.zip -Force
          Compress-Archive -Path artifacts/standalone/* -DestinationPath artifacts/SleepMngr-win-x64-standalone.zip -Force

      - name: Resolve release metadata
        id: release_meta
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $tag = ""

          if ($env:REF_TYPE -eq "tag" -and $env:REF_NAME.StartsWith("v")) {
            $tag = $env:REF_NAME
          }
          elseif ($env:EVENT_NAME -eq "push" -and $env:FULL_REF -eq "refs/heads/main") {
            $firstLine = ($env:COMMIT_MESSAGE -split "`r?`n")[0]
            if ($firstLine -match '^Release (v[0-9]+\.[0-9]+\.[0-9]+)$') {
              $tag = $Matches[1]
            }
          }

          "release_tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Upload compact artifact
        uses: actions/upload-artifact@v7
        with:
          name: SleepMngr-win-x64-compact
          path: |
            artifacts/compact/SleepMngr.exe
            artifacts/SleepMngr-win-x64-compact.zip
          if-no-files-found: error

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v7
        with:
          name: SleepMngr-win-x64-standalone
          path: |
            artifacts/standalone/SleepMngr.exe
            artifacts/SleepMngr-win-x64-standalone.zip
          if-no-files-found: error

      - name: Upload release files
        if: steps.release_meta.outputs.release_tag != ''
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            artifacts/SleepMngr-win-x64-compact.zip
            artifacts/SleepMngr-win-x64-standalone.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: needs.build.outputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release-files

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          TARGET_SHA: ${{ github.sha }}
        run: gh release create "$RELEASE_TAG" release-files/*.zip --target "$TARGET_SHA" --generate-notes --title "SleepMngr $RELEASE_TAG"
